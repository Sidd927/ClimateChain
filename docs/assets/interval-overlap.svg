<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Two claims on one real Verra retirement share 4,559 units</title>
  <desc id="d">Verra batch 18453 retirement covers units 896,309,560 to 896,329,558. Synthetic claim A (Northwind Foods) cites 896,309,560 to 896,319,559. Synthetic claim B (Helios Apparel) cites 896,315,001 to 896,322,000. The shared interval 896,315,001 to 896,319,559 is 4,559 units, and the ClaimLedger contract rejects claim B with RangeOverlap.</desc>
  <defs>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#5a2a2e"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#f08a8f" stroke-width="4"/>
    </pattern>
    <pattern id="reg" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#163d3e"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3f6f6e" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect width="1200" height="560" rx="18" fill="#0e2a2b"/>

  <!-- heading -->
  <text x="40" y="52" fill="#ffffff" font-size="26" font-weight="700">A claim is an interval. Double use is an intersection.</text>
  <text x="40" y="82" fill="#a9c4bf" font-size="15">Verra batch 18453 · VCS 1904 Wind Power Project in Tamil Nadu · real retirement record (Berkeley VROD 2026-08) · <tspan fill="#e8c46a">claimants are synthetic</tspan></text>

  <!-- shared column -->
  <rect x="440" y="128" width="212.8" height="196" fill="#f08a8f" opacity="0.08"/>
  <line x1="440" y1="128" x2="440" y2="336" stroke="#f08a8f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="652.8" y1="128" x2="652.8" y2="336" stroke="#f08a8f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M440 132 V122 H652.8 V132" fill="none" stroke="#f08a8f" stroke-width="2"/>
  <text x="546.4" y="113" fill="#f08a8f" font-size="17" font-weight="700" text-anchor="middle">4,559 units in both claims</text>

  <!-- row labels -->
  <text x="170" y="160" fill="#ffffff" font-size="15" font-weight="600" text-anchor="end">Registry retirement</text>
  <text x="170" y="178" fill="#8fb0aa" font-size="12.5" text-anchor="end">19,999 units · real</text>
  <text x="170" y="220" fill="#ffffff" font-size="15" font-weight="600" text-anchor="end">Claim A · Northwind</text>
  <text x="170" y="238" fill="#8fb0aa" font-size="12.5" text-anchor="end">10,000 units · anchored</text>
  <text x="170" y="280" fill="#ffffff" font-size="15" font-weight="600" text-anchor="end">Claim B · Helios</text>
  <text x="170" y="298" fill="#8fb0aa" font-size="12.5" text-anchor="end">7,000 units · submitted</text>

  <!-- tracks -->
  <rect x="180" y="148" width="980" height="36" rx="4" fill="#123536"/>
  <rect x="180" y="208" width="980" height="36" rx="4" fill="#123536"/>
  <rect x="180" y="268" width="980" height="36" rx="4" fill="#123536"/>

  <!-- registry 896,309,560–896,329,558 -->
  <rect x="186.1" y="150" width="933.3" height="32" rx="3" fill="url(#reg)" stroke="#4d8280" stroke-width="1"/>
  <!-- claim A 896,309,560–896,319,559 -->
  <rect x="186.1" y="210" width="466.7" height="32" rx="3" fill="#2e8a5c"/>
  <rect x="440" y="210" width="212.8" height="32" fill="url(#hatch)"/>
  <!-- claim B 896,315,001–896,322,000 -->
  <rect x="440" y="270" width="326.7" height="32" rx="3" fill="#163d3e" stroke="#d6e4e1" stroke-width="1.5"/>
  <rect x="440.75" y="270.75" width="212.05" height="30.5" fill="url(#hatch)"/>

  <!-- axis -->
  <line x1="180" y1="336" x2="1160" y2="336" stroke="#3f6f6e" stroke-width="1"/>
  <g fill="#8fb0aa" font-size="12" text-anchor="middle" class="mono">
    <line x1="206.7" y1="336" x2="206.7" y2="342" stroke="#3f6f6e"/><text x="206.7" y="358">896,310,000</text>
    <line x1="906.7" y1="336" x2="906.7" y2="342" stroke="#3f6f6e"/><text x="906.7" y="358">896,325,000</text>
  </g>
  <g fill="#f08a8f" font-size="12.5" font-weight="700" class="mono">
    <text x="436" y="358" text-anchor="end">896,315,001</text>
    <text x="657" y="358">896,319,559</text>
  </g>
  <text x="1160" y="358" fill="#8fb0aa" font-size="12" text-anchor="end">unit number →</text>

  <!-- cards -->
  <rect x="40" y="392" width="350" height="140" rx="12" fill="#123536" stroke="#244f4f"/>
  <text x="60" y="420" fill="#6cc496" font-size="12" font-weight="700" letter-spacing="0.8">CLAIM A · NORTHWIND FOODS (SYNTHETIC)</text>
  <text x="60" y="447" fill="#ffffff" font-size="15" class="mono">18453-<tspan fill="#6cc496">896309560-896319559</tspan>-VCS…</text>
  <text x="60" y="474" fill="#d6e4e1" font-size="14">10,000 units · checks pass</text>
  <text x="60" y="498" fill="#d6e4e1" font-size="14">Registered on ClaimLedger as claim #1</text>

  <rect x="410" y="392" width="350" height="140" rx="12" fill="#123536" stroke="#244f4f"/>
  <text x="430" y="420" fill="#d6e4e1" font-size="12" font-weight="700" letter-spacing="0.8">CLAIM B · HELIOS APPAREL (SYNTHETIC)</text>
  <text x="430" y="447" fill="#ffffff" font-size="15" class="mono">18453-<tspan fill="#f08a8f">896315001-896322000</tspan>-VCS…</text>
  <text x="430" y="474" fill="#d6e4e1" font-size="14">Different serial string, different PDF:</text>
  <text x="430" y="498" fill="#d6e4e1" font-size="14">a hash or exact-match check sees nothing.</text>

  <rect x="780" y="392" width="380" height="140" rx="12" fill="#2a1a1d" stroke="#7a3a40"/>
  <text x="800" y="420" fill="#f08a8f" font-size="12" font-weight="700" letter-spacing="0.8">SAME NAMESPACE · keccak("VCS:18453")</text>
  <text x="800" y="448" fill="#ffffff" font-size="14.5" class="mono">max(A₁,B₁) … min(A₂,B₂)</text>
  <text x="800" y="472" fill="#ffffff" font-size="14.5" class="mono">896,319,559 − 896,315,001 + 1 = <tspan fill="#f08a8f" font-weight="700">4,559</tspan></text>
  <text x="800" y="500" fill="#f5c9cc" font-size="12.5" class="mono">→ revert RangeOverlap(…, 896315001, 896319559)</text>
  <text x="800" y="520" fill="#c99ea2" font-size="12">A potential conflict for review, not proof of fraud.</text>
</svg>
